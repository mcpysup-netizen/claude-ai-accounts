<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="960" height="580" rx="20" fill="#fbf8f1"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1b2a4a"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff8649"/></marker>
  </defs>
  <text x="40" y="50" font-size="22" font-weight="700" fill="#1b2a4a">설정은 함께 쓰고, 로그인만 계정마다 따로</text>
  <text x="40" y="78" font-size="14" fill="#5b6478">Claude Code도 Codex도 같은 방식이다. 새 계정 폴더엔 로그인만 두고 나머지는 원래 폴더를 링크로 가리킨다.</text>

  <!-- Claude row -->
  <text x="40" y="122" font-size="13" font-weight="700" fill="#c2541f" letter-spacing="1">CLAUDE CODE</text>
  <rect x="40" y="134" width="360" height="200" rx="16" fill="#1b2a4a"/>
  <text x="64" y="170" font-size="17" font-weight="700" fill="#fff">공용 ~/.claude</text>
  <g font-size="14" fill="#e6e9f2">
    <rect x="64" y="186" width="312" height="30" rx="7" fill="#26375c"/><text x="78" y="206">settings.json · 훅 · 상태줄</text>
    <rect x="64" y="222" width="312" height="30" rx="7" fill="#26375c"/><text x="78" y="242">프로젝트 메모리 · 대화 기록</text>
    <rect x="64" y="258" width="312" height="30" rx="7" fill="#26375c"/><text x="78" y="278">플러그인 · 스킬 · 이 모드</text>
    <rect x="64" y="294" width="312" height="30" rx="7" fill="#26375c"/><text x="78" y="314">MCP 서버 설정(.claude.json)</text>
  </g>
  <rect x="600" y="134" width="320" height="90" rx="14" fill="#fff" stroke="#d9d3c4" stroke-width="2"/>
  <text x="622" y="166" font-size="16" font-weight="700" fill="#1b2a4a">C-MAIN · 기본 로그인</text>
  <text x="622" y="192" font-size="13" fill="#5b6478">~/.claude/.credentials.json</text>
  <rect x="600" y="244" width="320" height="90" rx="14" fill="#fff4ec" stroke="#ff8649" stroke-width="2.5"/>
  <text x="622" y="276" font-size="16" font-weight="700" fill="#1b2a4a">C-WORK · 계정 폴더</text>
  <text x="622" y="302" font-size="13" fill="#c2541f">~/.claude-accounts/work/.credentials.json</text>
  <path d="M600 180 C500 180 500 230 402 230" fill="none" stroke="#1b2a4a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <path d="M600 290 C500 290 500 250 402 250" fill="none" stroke="#ff8649" stroke-width="3" marker-end="url(#o)"/>

  <!-- Codex row -->
  <text x="40" y="384" font-size="13" font-weight="700" fill="#c2541f" letter-spacing="1">CODEX</text>
  <rect x="40" y="396" width="360" height="134" rx="16" fill="#1b2a4a"/>
  <text x="64" y="432" font-size="17" font-weight="700" fill="#fff">공용 ~/.codex</text>
  <g font-size="14" fill="#e6e9f2">
    <rect x="64" y="448" width="312" height="30" rx="7" fill="#26375c"/><text x="78" y="468">config.toml · AGENTS.md</text>
    <rect x="64" y="484" width="312" height="30" rx="7" fill="#26375c"/><text x="78" y="504">skills · rules · plugins · memories</text>
  </g>
  <rect x="600" y="396" width="320" height="74" rx="14" fill="#fff" stroke="#d9d3c4" stroke-width="2"/>
  <text x="622" y="426" font-size="16" font-weight="700" fill="#1b2a4a">G-MAIN · 기본 로그인</text>
  <text x="622" y="450" font-size="13" fill="#5b6478">~/.codex/auth.json</text>
  <rect x="600" y="486" width="320" height="74" rx="14" fill="#fff4ec" stroke="#ff8649" stroke-width="2.5"/>
  <text x="622" y="516" font-size="16" font-weight="700" fill="#1b2a4a">G-WORK · 계정 폴더</text>
  <text x="622" y="540" font-size="13" fill="#c2541f">~/.codex-accounts/work/auth.json · sessions/</text>
  <path d="M600 433 C500 433 500 470 402 470" fill="none" stroke="#1b2a4a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <path d="M600 523 C500 523 500 490 402 490" fill="none" stroke="#ff8649" stroke-width="3" marker-end="url(#o)"/>

  <text x="440" y="368" font-size="13" fill="#c2541f" font-weight="700">── 링크로 공유 ──</text>
</svg>
