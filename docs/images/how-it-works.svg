<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="960" height="520" rx="20" fill="#fbf8f1"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1b2a4a"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff8649"/></marker>
  </defs>

  <text x="40" y="52" font-size="22" font-weight="700" fill="#1b2a4a">설정은 함께 쓰고, 로그인만 계정마다 따로</text>
  <text x="40" y="80" font-size="14" fill="#5b6478">ai claude &lt;계정&gt; 은 로그인 폴더만 바꿔 띄운다. 훅·메모리·플러그인·MCP 설정은 그대로다.</text>

  <!-- shared -->
  <rect x="40" y="110" width="330" height="370" rx="16" fill="#1b2a4a"/>
  <text x="64" y="146" font-size="17" font-weight="700" fill="#fff">공용 ~/.claude</text>
  <text x="64" y="168" font-size="13" fill="#aab3c8">모든 계정이 함께 쓰는 것</text>
  <g font-size="14" fill="#e6e9f2">
    <rect x="64" y="186" width="282" height="40" rx="8" fill="#26375c"/><text x="80" y="211">settings.json · 훅 · 상태줄</text>
    <rect x="64" y="234" width="282" height="40" rx="8" fill="#26375c"/><text x="80" y="259">프로젝트 메모리 · 대화 기록</text>
    <rect x="64" y="282" width="282" height="40" rx="8" fill="#26375c"/><text x="80" y="307">플러그인 · 스킬 · 이 모드</text>
    <rect x="64" y="330" width="282" height="40" rx="8" fill="#26375c"/><text x="80" y="355">MCP 서버 설정(.claude.json)</text>
  </g>
  <text x="64" y="408" font-size="13" fill="#aab3c8">계정 폴더는 위 항목을 링크로 가리킨다.</text>
  <text x="64" y="430" font-size="13" fill="#aab3c8">한 번 고치면 모든 계정에 바로 반영.</text>

  <!-- per-account -->
  <g>
    <rect x="590" y="110" width="330" height="108" rx="16" fill="#fff" stroke="#d9d3c4" stroke-width="2"/>
    <text x="614" y="144" font-size="16" font-weight="700" fill="#1b2a4a">C-MAIN · 기본 로그인</text>
    <text x="614" y="170" font-size="13" fill="#5b6478">~/.claude/.credentials.json</text>
    <text x="614" y="194" font-size="13" fill="#5b6478">평소 쓰던 그대로</text>

    <rect x="590" y="236" width="330" height="108" rx="16" fill="#fff4ec" stroke="#ff8649" stroke-width="2.5"/>
    <text x="614" y="270" font-size="16" font-weight="700" fill="#1b2a4a">C-WORK · 계정 폴더</text>
    <text x="614" y="296" font-size="13" fill="#5b6478">~/.claude-accounts/work/</text>
    <text x="614" y="320" font-size="13" fill="#c2541f">로그인 파일 + 계정 정보만 따로</text>

    <rect x="590" y="362" width="330" height="118" rx="16" fill="#fff" stroke="#d9d3c4" stroke-width="2"/>
    <text x="614" y="396" font-size="16" font-weight="700" fill="#1b2a4a">G-MAIN · G-WORK · Codex</text>
    <text x="614" y="422" font-size="13" fill="#5b6478">계정마다 CODEX_HOME 폴더</text>
    <text x="614" y="446" font-size="13" fill="#5b6478">auth.json·기록은 따로, config는 링크</text>
  </g>

  <!-- links -->
  <path d="M590 164 C480 164 470 250 372 250" fill="none" stroke="#1b2a4a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <path d="M590 290 C480 290 470 290 372 290" fill="none" stroke="#ff8649" stroke-width="3" marker-end="url(#o)"/>
  <path d="M590 420 C480 420 470 340 372 340" fill="none" stroke="#1b2a4a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="408" y="278" font-size="13" fill="#c2541f" font-weight="700">링크로 공유</text>
</svg>
